services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pairspace
      POSTGRES_PASSWORD: "KvfeI1R38oNu3DuMIhD5bGL0EWkzrWUK"
    volumes:
      - pairspace_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "WsnD1GtUsqTV9VVxsQ30jQ-UzKgv2QEd"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: pairspace_test
      POSTGRES_PASSWORD: "JxX8Ln8M0GEw6eanyR2OTYb_Xn8XJG9g"
    volumes:
      - pairspace_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "TT3jSljrszf6zcjjbz3iaS0nkO9Tjt-u"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  pairspace_data:
  pairspace_test_data:
